<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>紅樹林靈糧堂</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:#43514b;
  background:#f7f8f3;
  line-height:1.8;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(250,252,248,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(151,139,103,.22);
}

nav{
  max-width:1150px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-size:20px;
  font-weight:700;
  color:#40594d;
  letter-spacing:2px;
}

.nav-links{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}

.nav-links a{
  color:#59665f;
  text-decoration:none;
  font-size:14px;
}

.hero{
  min-height:82vh;
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:90px 20px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.82),rgba(239,245,236,.82)),
    linear-gradient(135deg,#f8faf6,#e7efe5);
}

.window{
  position:absolute;
  width:min(920px,92%);
  height:68%;
  bottom:-5%;
  left:50%;
  transform:translateX(-50%);
  border:10px solid rgba(120,105,78,.15);
  border-bottom:0;
  border-radius:4px 4px 0 0;
}

.window::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:50%;
  width:5px;
  background:rgba(120,105,78,.12);
}

.window::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:48%;
  height:5px;
  background:rgba(120,105,78,.12);
}

.bridge{
  position:absolute;
  width:70%;
  height:120px;
  bottom:12%;
  left:50%;
  transform:translateX(-50%);
  opacity:.18;
}

.bridge::before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:65%;
  height:3px;
  background:#64776e;
}

.bridge::after{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  width:3px;
  height:80%;
  background:#64776e;
  transform:rotate(-5deg);
}

.garden-left,.garden-right{
  position:absolute;
  bottom:0;
  width:34%;
  height:38%;
  opacity:.28;
}

.garden-left{
  left:-5%;
  background:
    radial-gradient(circle at 40% 70%,#6f8d72 0 15%,transparent 16%),
    radial-gradient(circle at 65% 55%,#86a184 0 17%,transparent 18%),
    radial-gradient(circle at 20% 45%,#78957a 0 20%,transparent 21%);
}

.garden-right{
  right:-5%;
  background:
    radial-gradient(circle at 40% 70%,#78957a 0 18%,transparent 19%),
    radial-gradient(circle at 70% 45%,#91aa8d 0 17%,transparent 18%),
    radial-gradient(circle at 20% 60%,#6f8d72 0 20%,transparent 21%);
}

.hero-content{
  position:relative;
  z-index:5;
  max-width:780px;
}

.hero-small{
  color:#9b875b;
  font-size:12px;
  letter-spacing:5px;
  margin-bottom:20px;
}

.hero h1{
  font-family:serif;
  font-size:clamp(42px,9vw,76px);
  font-weight:500;
  letter-spacing:5px;
  color:#40594d;
  margin-bottom:15px;
}

.hero h2{
  font-size:clamp(18px,4vw,26px);
  color:#8c7951;
  font-weight:400;
  margin-bottom:22px;
}

.hero p{
  max-width:620px;
  margin:auto;
  color:#58645e;
  font-size:16px;
}

.hero-buttons{
  margin-top:32px;
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.button{
  display:inline-block;
  padding:12px 25px;
  border-radius:40px;
  text-decoration:none;
  font-size:14px;
  transition:.25s;
}

.primary{
  background:#50695b;
  color:white;
}

.secondary{
  color:#657267;
  border:1px solid #a99a74;
  background:rgba(255,255,255,.65);
}

.button:hover{
  transform:translateY(-2px);
}

section{
  padding:80px 20px;
}

.container{
  max-width:1080px;
  margin:auto;
}

.soft{
  background:#eef3ec;
}

.section-title{
  text-align:center;
  margin-bottom:45px;
}

.section-title span{
  color:#9c8960;
  font-size:11px;
  letter-spacing:5px;
}

.section-title h2{
  margin-top:8px;
  font-family:serif;
  font-weight:500;
  font-size:32px;
  color:#455c50;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

  background:rgba(255,255,255,.83);
  border:1px sol
